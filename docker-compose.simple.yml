version: '3.8'

services:
  # PostgreSQL Database (optional - can use SQLite for development)
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: instareply_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d instareply_db"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Backend API (simplified)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:root@postgres:5432/autonique_db
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - FACEBOOK_APP_ID=${FACEBOOK_APP_ID}
      - FACEBOOK_APP_SECRET=${FACEBOOK_APP_SECRET}
      - JWT_SECRET_KEY=dev_secret_key_change_in_production
      - WEBHOOK_VERIFY_TOKEN=dev_webhook_token
      - ENVIRONMENT=development
      - DEBUG=True
      - ENABLE_CACHING=True
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Frontend (simplified)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_FRONTEND_URL=http://localhost:3000
      - NEXT_PUBLIC_FACEBOOK_APP_ID=${FACEBOOK_APP_ID}
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev

volumes:
  postgres_data:
